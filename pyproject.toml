[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "radark-handover"
dynamic = ["version"]
description = "Lightweight file-based handovers between AI agent teams: a CLI for a software dark factory."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = []          # standard library only; git is needed only for `ho sync`
keywords = ["ai-agents", "claude-code", "dark-factory", "software-factory", "handover", "cli", "markdown", "git"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Environment :: Console",
]

[project.urls]
Homepage = "https://github.com/raaleksandr/radark-handover"

[project.scripts]
ho = "ho:main"

[tool.setuptools]
py-modules = ["ho"]
packages = ["ho_templates"]

[tool.setuptools.dynamic]
version = {attr = "ho.__version__"}

[tool.setuptools.package-data]
ho_templates = ["*.md"]
